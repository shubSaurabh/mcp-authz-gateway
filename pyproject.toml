[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-authz-gateway"
version = "0.1.0"
description = "Policy, human approval and tamper-evident audit for AI agent tool calls over MCP"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Shubham Saurabh" }]
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]
keywords = ["mcp", "model context protocol", "ai agents", "authorization", "security", "audit"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Security", "License :: Other/Proprietary License"]

[project.urls]
Homepage = "https://github.com/shubSaurabh/mcp-authz-gateway"

[project.scripts]
mcp-authz-gateway = "mcp_authz_gateway.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
